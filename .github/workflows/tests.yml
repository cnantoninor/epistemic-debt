name: tests

# Merging to main is effectively the release here — the README installs the
# plugin straight from this repo's default branch — so the checks run before
# the merge, not after.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The scripts run wherever the target repo lives, on whatever Python
        # is already there. Testing the oldest still-supported version and the
        # newest keeps that promise honest.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the scripts are stdlib-only by design, and adding a
      # dependency here would hide a violation of that rule.
      - run: python3 -m unittest discover -s skills/epistemic-debt/scripts -p "test_*.py" --verbose

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json and marketplace.json must agree on the version
        run: |
          python3 - <<'PY'
          import json, sys

          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          entries = [p for p in market["plugins"] if p["name"] == plugin["name"]]
          if not entries:
              sys.exit(f"marketplace.json has no entry for plugin {plugin['name']!r}.")

          versions = {
              "plugin.json": plugin["version"],
              "marketplace.json metadata": market["metadata"]["version"],
              "marketplace.json entry": entries[0]["version"],
          }
          if len(set(versions.values())) > 1:
              sys.exit("Version mismatch: " + ", ".join(f"{k} = {v}" for k, v in versions.items()))
          print(f"Version {plugin['version']} agrees across both manifests.")
          PY
